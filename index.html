<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio — Veerathu Moukthika</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1e3a8a;
      --accent:#60a5fa;
      --text:#f1f5f9;
      --card:#1e293b;
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
    }

    header{
      position:sticky;
      top:0;
      background:rgba(15,23,42,0.85);
      backdrop-filter:blur(8px);
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 32px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;}
    .brand .logo{
      width:42px;height:42px;border-radius:10px;
      background:linear-gradient(135deg,#60a5fa,#2563eb);
      display:flex;align-items:center;justify-content:center;
      color:white;font-weight:800;
    }

    nav a{
      color:var(--text);
      text-decoration:none;
      margin:0 10px;
      padding:8px 14px;
      border-radius:8px;
      font-weight:600;
      transition:background 0.3s;
    }
    nav a:hover{background:rgba(96,165,250,0.15);}

    main{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      padding:80px 20px;
    }

    h1{font-size:38px;margin-bottom:12px;}
    p{max-width:600px;font-size:18px;line-height:1.6;color:#cbd5e1;}
    .cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}

    .btn{
      background:var(--accent);
      color:#fff;
      padding:12px 20px;
      border-radius:8px;
      text-decoration:none;
      font-weight:700;
      transition:transform 0.2s;
    }
    .btn:hover{transform:translateY(-3px);}

    footer{text-align:center;padding:20px;font-size:14px;color:#94a3b8;}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">MV</div>
      <div>Veerathu Moukthika</div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1><span style="color:var(--accent)">Veerathu Moukthika</span></h1>
    <p>3rd-year Computer Science student passionate about Artificial Intelligence, Machine Learning, and building creative web projects.</p>
    <div class="cta">
      <a href="projects.html" class="btn">View Projects</a>
      <a href="resume.pdf" class="btn" target="_blank">📄 Resume</a>
      <a href="https://github.com/moukthikav" class="btn" target="_blank">💻 GitHub</a>
    </div>
  </main>

  <footer>© 2025 Veerathu Moukthika — All Rights Reserved</footer>
</body>
</html>
